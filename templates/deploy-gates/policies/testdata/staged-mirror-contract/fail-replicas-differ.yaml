---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: staged-forge
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: harbor.example.com/forge/svc@sha256:aaa
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: forge
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: app
          image: harbor.example.com/forge/svc@sha256:aaa
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
