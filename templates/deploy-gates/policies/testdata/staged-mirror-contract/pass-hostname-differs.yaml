---
# Hostnames in Gateway/HTTPRoute differ — this is PERMITTED. Policy doesn't
# compare Gateway/HTTPRoute hostname fields (omitted from must-match list).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svc
  namespace: staged-forge
spec:
  hostnames: ["staged.forge.example.com"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svc
  namespace: forge
spec:
  hostnames: ["forge.example.com"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: staged-forge
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: harbor.example.com/forge/svc@sha256:aaa
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: forge
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: harbor.example.com/forge/svc@sha256:aaa
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
