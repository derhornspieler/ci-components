---
# deploy-gates — MinimalCD v4.0.0 leaf component
#
# Runs inside continuous-delivery/app-deployments CI on MRs targeting
# dev / staged / prod branches. Renders Kustomize overlays, then runs gates
# in parallel.
#
# Kyverno is NOT installed in the cluster — the staged=prod mirror contract
# is enforced CI-side via conftest + the rego policy under
# templates/deploy-gates/policies/staged-mirror-contract.rego.
#
# perf-regression gate runs only on MRs targeting prod; currently a placeholder
# that will invoke an Argo Workflow once that workflow ships (separate MR).

spec:
  inputs:
    app_deployments_path:
      description: "Relative path in the repo containing overlays/*"
      type: string
      default: "."
    tool_image:
      description: "Shell tool image (kustomize, kubectl, conftest, etc.)"
      type: string
      default: "harbor.example.com/docker.io/library/alpine:3.21"
    kubeconform_image:
      description: "Kubeconform image"
      type: string
      default: "harbor.example.com/ghcr.io/yannh/kubeconform:v0.6.7"
    trivy_image:
      description: "Trivy image"
      type: string
      default: "harbor.example.com/docker.io/aquasec/trivy:0.58.1"
    conftest_image:
      description: "Conftest image"
      type: string
      default: "harbor.example.com/docker.io/openpolicyagent/conftest:v0.56.0"
    cosign_image:
      description: "Cosign image"
      type: string
      default: "harbor.example.com/ghcr.io/sigstore/cosign/cosign:v2.4.1"
    policies_dir:
      description: "Directory (relative to this component) containing Rego policies"
      type: string
      default: "policies"
    vault_role:
      description: "Vault JWT role for cosign public key"
      type: string
      default: "gitlab-ci"
    runner_tags:
      description: "Runner tags for light jobs (lint/test/pre-check/promote/deploy-gates)."
      type: array
      default: ["shared"]
---

include:
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/platform@4.0.14
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/vault-auth@4.0.14
    inputs:
      vault_role: "$[[ inputs.vault_role ]]"

stages: [render, gate]

".gates-rules":
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staged"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "prod"

"gate:render":
  stage: render
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.tool_image ]]"
  rules: !reference [".gates-rules", rules]
  variables:
    APPDEPS_PATH: "$[[ inputs.app_deployments_path ]]"
  script:
    - apk add --no-cache bash git curl jq
    - |
      if ! command -v kustomize >/dev/null 2>&1; then
        curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin
      fi
    - |
      bash -euo pipefail <<'BASH'
      mkdir -p rendered
      git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      CHANGED=$(git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD | awk -F/ '/overlays\// {for(i=1;i<=NF;i++) if($i=="overlays"){print $1"/"$2"/"$3"/"$4"/"$5; break}}' | sort -u)
      if [ -z "$CHANGED" ]; then
        echo "[gate:render] no overlay changes detected; rendering all overlays for target branch"
        CHANGED=$(find "${APPDEPS_PATH}" -type d -path '*/overlays/*' -not -path '*/overlays' | sort -u)
      fi
      for OVR in $CHANGED; do
        [ -d "$OVR" ] || continue
        OUT="rendered/$(echo "$OVR" | tr / _).yaml"
        echo "[gate:render] $OVR -> $OUT"
        kustomize build "$OVR" > "$OUT"
      done
      BASH
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rendered/

"gate:kubeconform":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.kubeconform_image ]]"
  rules: !reference [".gates-rules", rules]
  needs:
    - job: "gate:render"
      artifacts: true
  script:
    - kubeconform -strict -ignore-missing-schemas -summary rendered/

"gate:trivy-config":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.trivy_image ]]"
  rules: !reference [".gates-rules", rules]
  needs:
    - job: "gate:render"
      artifacts: true
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 rendered/

"gate:conftest":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.conftest_image ]]"
  rules: !reference [".gates-rules", rules]
  needs:
    - job: "gate:render"
      artifacts: true
  script:
    - conftest verify --policy "$[[ inputs.policies_dir ]]"
    - conftest test --policy "$[[ inputs.policies_dir ]]" rendered/

"gate:cosign-verify":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.cosign_image ]]"
  rules: !reference [".gates-rules", rules]
  needs:
    - job: "gate:render"
      artifacts: true
  before_script:
    - !reference [".fetch-platform-context", before_script]
    - !reference [".vault-auth-jwt", before_script]
    - !reference [".cosign-verify-auth", before_script]
  script:
    - apk add --no-cache jq grep bash
    - |
      bash -euo pipefail <<'BASH'
      FAIL=0
      REFS=$(grep -rhoE '[a-zA-Z0-9.\-_/]+@sha256:[a-f0-9]{64}' rendered/ | sort -u)
      [ -z "$REFS" ] && { echo "[gate:cosign-verify] no image digests found in rendered manifests"; exit 0; }
      for R in $REFS; do
        echo "[gate:cosign-verify] $R"
        if ! cosign verify --key /tmp/cosign.pub "$R" > /dev/null 2>&1; then
          echo "FAIL: $R"
          FAIL=$((FAIL+1))
        fi
      done
      [ "$FAIL" -eq 0 ] || exit 1
      BASH

"gate:argocd-diff":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.tool_image ]]"
  rules: !reference [".gates-rules", rules]
  needs:
    - job: "gate:render"
      artifacts: true
  before_script:
    - !reference [".fetch-platform-context", before_script]
    - !reference [".vault-auth-jwt", before_script]
  variables:
    # Overridable per-consumer; defaults to <app>-<env> Application naming convention.
    ARGOCD_APP_NAME: ""
  script:
    - apk add --no-cache curl jq
    - |
      set -euo pipefail
      # shellcheck disable=SC1091
      source /tmp/platform-context.env

      # Derive Application name from MR target branch + path if not explicit.
      # Path in app-deployments is <team>/<app>/overlays/<env>; Application is <env>-<app>.
      if [ -z "${ARGOCD_APP_NAME}" ]; then
        if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
          ENV="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        else
          ENV="${CI_COMMIT_BRANCH:-dev}"
        fi
        # Best-effort: take the first changed overlay directory's app segment.
        APP=$(find rendered -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | head -1)
        [ -n "${APP}" ] || { echo "[gate:argocd-diff] cannot derive app name — set ARGOCD_APP_NAME input"; exit 1; }
        ARGOCD_APP_NAME="${ENV}-${APP}"
      fi

      echo "[gate:argocd-diff] querying ArgoCD for ${ARGOCD_APP_NAME}"

      # Get ArgoCD token via JWT auth (same vault-auth creds have an argocd-api role).
      ARGOCD_TOKEN=$(curl -sS --fail-with-body -X POST "${ARGOCD_API}/session" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"ci-reader\",\"password\":\"${VAULT_TOKEN}\"}" \
        | jq -r '.token // empty')

      if [ -z "${ARGOCD_TOKEN}" ]; then
        echo "[gate:argocd-diff] WARN: ArgoCD auth failed — reporting manifests locally only"
        ARGOCD_TOKEN=""
      fi

      # Fetch current live manifests from ArgoCD
      if [ -n "${ARGOCD_TOKEN}" ]; then
        curl -sS --fail-with-body \
          "${ARGOCD_API}/applications/${ARGOCD_APP_NAME}/manifests" \
          -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
          | jq -r '.manifests[]' > /tmp/live.yaml 2>/dev/null || true
      fi

      # Concatenate rendered manifests for diff
      cat rendered/*.yaml > /tmp/rendered.yaml

      if [ -s /tmp/live.yaml ]; then
        echo "[gate:argocd-diff] === diff live vs rendered ==="
        diff -u /tmp/live.yaml /tmp/rendered.yaml | head -200 || true
        echo "[gate:argocd-diff] diff preview complete (exit 0 — informational)"
      else
        echo "[gate:argocd-diff] no live manifests (first deploy or auth failed) — showing rendered preview"
        head -100 /tmp/rendered.yaml
      fi
      # Non-blocking: diff content isn't a pass/fail signal. Execution failure IS (fail-with-body above).

"gate:perf-regression":
  stage: gate
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.tool_image ]]"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "prod"
  needs:
    - job: "gate:render"
      artifacts: true
  before_script:
    - !reference [".fetch-platform-context", before_script]
    - !reference [".vault-auth-jwt", before_script]
  variables:
    # How long to wait for the perf-regression workflow commit status.
    PERF_GATE_TIMEOUT_SECONDS: "2400"   # 40 minutes
    PERF_GATE_POLL_INTERVAL: "20"
  script:
    - apk add --no-cache curl jq
    - |
      set -euo pipefail
      # shellcheck disable=SC1091
      source /tmp/platform-context.env

      # Target: the staged branch HEAD SHA (what's about to be merged to prod).
      # In an app-deployments MR to prod, $CI_MERGE_REQUEST_SOURCE_BRANCH_SHA is the staged SHA.
      STAGED_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA}}"
      APP=$(find rendered -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | head -1)
      [ -n "${APP}" ] || { echo "[gate:perf-regression] cannot derive app name from rendered/"; exit 1; }

      CTX="perf-regression-gate/${APP}"
      PROJECT_PATH_ENC=$(echo "${CI_PROJECT_PATH}" | sed 's|/|%2F|g')
      API="${GITLAB_BASE_URL}/api/v4"

      # Fetch GitLab API token from the same platform/ci-robots path the workflow uses.
      GITLAB_TOKEN=$(curl -sS --fail-with-body -H "X-Vault-Token: ${VAULT_TOKEN}" \
        "${VAULT_ADDR}/v1/kv/data/platform/ci-robots/gitlab-api-token" \
        | jq -r '.data.data.token')

      echo "[gate:perf-regression] polling commit status '${CTX}' on ${STAGED_SHA:0:8} (timeout ${PERF_GATE_TIMEOUT_SECONDS}s)"

      DEADLINE=$(( $(date +%s) + PERF_GATE_TIMEOUT_SECONDS ))
      while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
        STATE=$(curl -sS --fail-with-body \
          "${API}/projects/${PROJECT_PATH_ENC}/repository/commits/${STAGED_SHA}/statuses?name=${CTX}" \
          -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          | jq -r "[.[] | select(.name==\"${CTX}\")] | sort_by(.created_at) | last | .status // \"not-found\"")

        case "${STATE}" in
          success)
            echo "[gate:perf-regression] PASS"
            exit 0 ;;
          failed)
            echo "[gate:perf-regression] FAIL — staged perf regression gate reported failure"
            curl -sS "${API}/projects/${PROJECT_PATH_ENC}/repository/commits/${STAGED_SHA}/statuses?name=${CTX}" \
              -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" | jq -r '.[-1].description // ""'
            exit 1 ;;
          canceled)
            echo "[gate:perf-regression] CANCELED — workflow was aborted"
            exit 1 ;;
          pending|running|not-found)
            printf "." ;;
          *)
            echo "[gate:perf-regression] unknown state '${STATE}' — continuing to poll" ;;
        esac
        sleep "${PERF_GATE_POLL_INTERVAL}"
      done

      echo ""
      echo "[gate:perf-regression] TIMEOUT after ${PERF_GATE_TIMEOUT_SECONDS}s — perf workflow did not complete"
      echo "  Check argo-events Sensor + WorkflowTemplate in cluster: kubectl get workflows -n argo-events"
      exit 1
