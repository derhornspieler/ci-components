---
# scan — MinimalCD v4.0.0 leaf component
#
# Per stack: Trivy vuln + misconfig (fail-closed HIGH/CRITICAL), Syft SBOM,
# Cosign sign with key at platform/cosign/sign. Uses _vault-auth.

spec:
  inputs:
    stacks:
      description: "Structured stack declarations (spec §7)"
      type: array
      default: []
    team:
      description: "Team slug"
      type: string
    trivy_image:
      description: "Trivy image. TODO ADR-5: pin @sha256:..."
      type: string
      default: "harbor.example.com/docker.io/aquasec/trivy:0.58.1"
    syft_image:
      description: "Syft image. TODO ADR-5: pin @sha256:..."
      type: string
      default: "harbor.example.com/docker.io/anchore/syft:v1.18.1"
    cosign_image:
      description: "Base image for SBOM + cosign sign. Cosign + syft installed at runtime via curl."
      type: string
      default: "harbor.example.com/docker.io/library/alpine:3.21"
    severity:
      description: "Trivy severity gate"
      type: string
      default: "HIGH,CRITICAL"
    vault_role:
      description: "Vault JWT role for cosign + harbor creds"
      type: string
      default: "gitlab-ci"
    runner_tags:
      description: "Runner tags for light jobs (fallback/default)."
      type: array
      default: ["shared"]
    heavy_runner_tags:
      description: "Runner tags for heavy jobs (build:image / scan:image). Defaults to shared+compute."
      type: array
      default: ["shared", "compute"]
---

include:
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/platform@4.0.14
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/vault-auth@4.0.14
    inputs:
      vault_role: "$[[ inputs.vault_role ]]"

stages: [scan]

"scan:image":
  stage: scan
  tags: $[[ inputs.heavy_runner_tags ]]
  image: "$[[ inputs.trivy_image ]]"
  rules: !reference [".rules-on-mr-and-main", rules]
  needs:
    - job: "build:image"
      artifacts: true
  variables:
    TEAM: "$[[ inputs.team ]]"
    SEVERITY: "$[[ inputs.severity ]]"
  before_script:
    - !reference [".fetch-platform-context", before_script]
    - !reference [".vault-auth-jwt", before_script]
    - !reference [".install-yq", before_script]
    - |
      cat > /tmp/stacks.yml <<'STACKS_YAML'
      $[[ inputs.stacks ]]
      STACKS_YAML
    - !reference [".dump-stacks", before_script]
    - !reference [".convert-stacks-json", before_script]
    - !reference [".cosign-sign-auth", before_script]
  script:
    - apk add --no-cache curl jq bash
    - |
      bash -euo pipefail <<'BASH'
      # shellcheck disable=SC1091
      source /tmp/platform-context.env
      mkdir -p scan-reports

      # Harbor login for trivy to pull private images
      ROBOT=$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
        "${VAULT_ADDR}/v1/kv/data/platform/ci-robots/harbor-dev-push" | jq -r '.data.data')
      export TRIVY_USERNAME=$(echo "$ROBOT" | jq -r '.username')
      export TRIVY_PASSWORD=$(echo "$ROBOT" | jq -r '.token')

      LEN=$(echo "$STACKS_JSON" | jq 'length')
      for i in $(seq 0 $((LEN-1))); do
        S=$(echo "$STACKS_JSON" | jq ".[$i]")
        NAME=$(echo "$S" | jq -r '.name')
        IMG_REF=$(cat "digests/${NAME}-digest.txt")
        echo "::group::scan ${NAME} ${IMG_REF}"
        trivy image --scanners vuln,secret --severity "$SEVERITY" --exit-code 1 \
          --format json -o "scan-reports/trivy-vuln-${NAME}.json" "${IMG_REF}"
        echo "::endgroup::"
      done
      BASH
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - scan-reports/
      - digests/

"scan:sbom-and-sign":
  stage: scan
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.cosign_image ]]"
  rules: !reference [".rules-on-mr-and-main", rules]
  needs:
    - job: "build:image"
      artifacts: true
    - job: "scan:image"
  before_script:
    - !reference [".fetch-platform-context", before_script]
    - !reference [".vault-auth-jwt", before_script]
    - !reference [".install-yq", before_script]
    - |
      cat > /tmp/stacks.yml <<'STACKS_YAML'
      $[[ inputs.stacks ]]
      STACKS_YAML
    - !reference [".dump-stacks", before_script]
    - !reference [".convert-stacks-json", before_script]
    - !reference [".cosign-sign-auth", before_script]
  script:
    - apk add --no-cache curl jq bash
    - |
      bash -euo pipefail <<'BASH'
      # shellcheck disable=SC1091
      source /tmp/platform-context.env
      mkdir -p scan-reports

      # Install cosign + syft as static binaries (alpine base, not the
      # heavy cosign Docker image which has 13 layers and fails to start
      # on resource-constrained K8s nodes post-outage).
      if ! command -v cosign >/dev/null 2>&1; then
        curl -sSfL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64"
        chmod +x /usr/local/bin/cosign
      fi
      if ! command -v syft >/dev/null 2>&1; then
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      fi

      # Harbor auth — syft + cosign need to pull the private image
      ROBOT=$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
        "${VAULT_ADDR}/v1/kv/data/platform/ci-robots/harbor-dev-push" | jq -r '.data.data')
      HARBOR_USER=$(echo "$ROBOT" | jq -r '.username')
      HARBOR_TOKEN=$(echo "$ROBOT" | jq -r '.token')
      mkdir -p ~/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}' "${HARBOR_DEV_REGISTRY}" \
        "$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_TOKEN}" | base64)" > ~/.docker/config.json

      LEN=$(echo "$STACKS_JSON" | jq 'length')
      for i in $(seq 0 $((LEN-1))); do
        S=$(echo "$STACKS_JSON" | jq ".[$i]")
        NAME=$(echo "$S" | jq -r '.name')
        IMG_REF=$(cat "digests/${NAME}-digest.txt")
        echo "::group::sbom+sign ${NAME}"
        syft "${IMG_REF}" -o spdx-json > "scan-reports/sbom-${NAME}.spdx.json"
        cosign sign --yes --key /tmp/cosign.key "${IMG_REF}"
        echo "::endgroup::"
      done
      BASH
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - scan-reports/
