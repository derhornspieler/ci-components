---
# pre-check — MinimalCD v4.0.0 leaf component
#
# Runs once per pipeline: gitleaks secret scan, commitlint, license headers,
# and stack-validate (spec §7). No Vault needed.

spec:
  inputs:
    stacks:
      description: "Structured stack declarations (spec §7). Required for stack-validate."
      type: array
      default: []
    ignore_detected:
      description: "Languages to skip in stack-validate (e.g. [go] when go.mod lives in vendor/)"
      type: array
      default: []
    exclude_paths:
      description: "Glob paths to exclude from language marker detection"
      type: array
      default: []
    gitleaks_image:
      description: "gitleaks image. TODO ADR-5: pin @sha256:..."
      type: string
      default: "harbor.example.com/docker.io/zricethezav/gitleaks:v8.21.2"
    commitlint_image:
      description: "Node image with commitlint. TODO ADR-5: pin @sha256:..."
      type: string
      default: "harbor.example.com/docker.io/library/node:20-alpine"
    tool_image:
      description: "Shell tool image for license-headers and stack-validate"
      type: string
      default: "harbor.example.com/docker.io/library/alpine:3.21"
    runner_tags:
      description: "Runner tags for light jobs (lint/test/pre-check/promote/deploy-gates)."
      type: array
      default: ["shared"]
---

include:
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/platform@4.0.14

stages: [pre-check]

"pre-check:secrets":
  stage: pre-check
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.gitleaks_image ]]"
  rules: !reference [".rules-on-mr-and-main", rules]
  script:
    - |
      set -euo pipefail
      # If the consumer ships its own .gitleaks.toml (or .yaml), respect it.
      # Otherwise auto-detect external-secrets.io CRs (ExternalSecret /
      # SecretStore / ClusterSecretStore) and allowlist those paths so the
      # rule that flags "looks-like-a-k8s-Secret-yaml" stops false-positiving
      # on CRs that only REFERENCE secrets (no secret material on disk).
      # Reported by forge on ci-components#3 note 3757.
      if [ -f .gitleaks.toml ] || [ -f .gitleaks.yaml ]; then
        echo "[pre-check:secrets] using consumer's .gitleaks config"
        gitleaks detect --source . --verbose --redact --no-banner --exit-code 1
      else
        ES_FILES=$(find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
          -not -path './.git/*' \
          -exec grep -l -E '^kind:[[:space:]]+(ExternalSecret|SecretStore|ClusterSecretStore)\b' {} + 2>/dev/null \
          | sort -u | sed 's|^\./||' || true)
        {
          echo '[extend]'
          echo 'useDefault = true'
          if [ -n "${ES_FILES}" ]; then
            echo
            echo '[allowlist]'
            echo 'description = "external-secrets.io CRs (auto-detected): ExternalSecret/SecretStore/ClusterSecretStore reference secrets, no material on disk"'
            echo 'paths = ['
            while IFS= read -r f; do
              esc=${f//\"/\\\"}
              printf '  "%s",\n' "${esc}"
            done <<<"${ES_FILES}"
            echo ']'
          fi
        } > /tmp/gitleaks.toml
        echo "[pre-check:secrets] auto-detected ExternalSecret-family files:"
        echo "${ES_FILES:-<none>}" | sed 's/^/  /'
        gitleaks detect --source . --config /tmp/gitleaks.toml --verbose --redact --no-banner --exit-code 1
      fi

"pre-check:commitlint":
