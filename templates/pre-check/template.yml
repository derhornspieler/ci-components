"pre-check:license-headers":
  stage: pre-check
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.tool_image ]]"
  rules: !reference [".rules-on-mr-and-main", rules]
  script:
    - apk add --no-cache git grep
    - |
      set -euo pipefail
      # Use git ls-files instead of find to avoid a race on K8s ephemeral
      # volumes where find traverses before all file contents are flushed
      # post-checkout, causing head to read truncated/empty files
      # non-deterministically. Reported by forge on ci-components#3 note 3787.
      FILES=$(git ls-files '*.py' '*.go' '*.ts' '*.js')
      if [ -z "$FILES" ]; then
        echo "[license-headers] no source files (*.py/*.go/*.ts/*.js) in repo, skipping"
        exit 0
      fi
      FLAGGED=$(echo "$FILES" \
        | xargs grep -L -E '(Copyright|SPDX-License-Identifier|Licensed under)' 2>/dev/null || true)
      if [ -n "$FLAGGED" ]; then
        echo "License header missing on the following files:"
        echo "$FLAGGED" | sed 's/^/  /'
        MISSING=$(echo "$FLAGGED" | wc -l)
        echo "Total: $MISSING files"
        exit 1
      fi

"pre-check:stack-validate":
  stage: pre-check
  tags: $[[ inputs.runner_tags ]]
  image: "$[[ inputs.tool_image ]]"
  rules: !reference [".rules-on-mr-and-main", rules]
  before_script:
    - apk add --no-cache jq findutils bash
    - !reference [".install-yq", before_script]
    - |
      cat > /tmp/stacks.yml <<'STACKS_YAML'
      $[[ inputs.stacks ]]
      STACKS_YAML
      cat > /tmp/ignore.yml <<'IGNORE_YAML'
      $[[ inputs.ignore_detected ]]
      IGNORE_YAML
      cat > /tmp/exclude.yml <<'EXCLUDE_YAML'
      $[[ inputs.exclude_paths ]]
      EXCLUDE_YAML
    - !reference [".dump-stacks", before_script]
    - !reference [".convert-stacks-json", before_script]
    - |
      IGNORE_JSON=$(yq -o=json '.' /tmp/ignore.yml)
      EXCLUDE_JSON=$(yq -o=json '.' /tmp/exclude.yml)
      export IGNORE_JSON EXCLUDE_JSON
  script:
    - |
      bash -euo pipefail <<'BASH'
      DECLARED=$(echo "$STACKS_JSON" | jq -r '[.[].language] | unique | .[]' 2>/dev/null || true)
      IGNORED=$(echo "$IGNORE_JSON" | jq -r '.[]' 2>/dev/null || true)

      # Build find prune expression
      PRUNES=( -name .git -o -name vendor -o -name node_modules -o -name .venv -o -name venv -o -name dist -o -name .tox -o -name target )
      # User-supplied exclusions
      while IFS= read -r p; do
        [ -z "$p" ] && continue
        PRUNES+=( -o -path "./$p" )
      done < <(echo "$EXCLUDE_JSON" | jq -r '.[]' 2>/dev/null || true)

      DETECTED=""
      find . -type d \( "${PRUNES[@]}" \) -prune -o -type f \( \
          -name pyproject.toml -o -name setup.py -o -name requirements.txt \
          -o -name package.json -o -name go.mod -o -name Cargo.toml \
          -o -name pom.xml -o -name build.gradle \
        \) -print | while read -r f; do echo "$(basename "$f")"; done | sort -u > /tmp/markers.txt

      grep -qE 'pyproject.toml|setup.py|requirements.txt' /tmp/markers.txt && DETECTED="$DETECTED python"
      grep -q 'package.json' /tmp/markers.txt                              && DETECTED="$DETECTED typescript"
      grep -q 'go.mod' /tmp/markers.txt                                    && DETECTED="$DETECTED go"
      grep -q 'Cargo.toml' /tmp/markers.txt                                && DETECTED="$DETECTED rust"
      grep -qE 'pom.xml|build.gradle' /tmp/markers.txt                     && DETECTED="$DETECTED java"

      echo "[stack-validate] declared:  $(echo $DECLARED | tr '\n' ' ')"
      echo "[stack-validate] detected:  $DETECTED"
      echo "[stack-validate] ignored:   $(echo $IGNORED | tr '\n' ' ')"

      MISSING=""
      for d in $DETECTED; do
        echo "$DECLARED" | grep -qx "$d" && continue
        echo "$IGNORED"  | grep -qx "$d" && continue
        MISSING="$MISSING $d"
      done

      if [ -n "$MISSING" ]; then
        cat <<EOF
      ERROR: undeclared language(s) detected:$MISSING

      Add to .gitlab-ci.yml pipeline input 'stacks:' — for example:
        stacks:
          - name: core
            language:$MISSING
            paths: ["**"]
            project_dir: "."

      Or silence with ignore_detected: [${MISSING# }]
      EOF
        exit 1
      fi

      # Warn on declared-but-not-found
      for d in $DECLARED; do
        if ! echo "$DETECTED" | grep -qw "$d"; then
          echo "[stack-validate] WARN: declared '$d' but no markers found"
        fi
      done
      echo "[stack-validate] OK"
      BASH
