# Canonical consumer pattern: single-stack TypeScript / SPA.
include:
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/platform@RC_VERSION
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/pipeline@RC_VERSION
    inputs:
      team: smoketest
      app: svc-ts
      stacks:
        - name: ui
          language: typescript
          paths: ["**"]
          project_dir: "."
          test_command: "npx vitest run --coverage --reporter=junit"
          coverage_threshold: 0
          image_name: svc-ts
          dockerfile: Dockerfile
          build_context: "."
