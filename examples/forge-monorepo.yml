# forge monorepo — MinimalCD v4.0.0
# Place at forge/forge/.gitlab-ci.yml
include:
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/platform@4.0.14
  - component: $CI_SERVER_FQDN/continuous-delivery/ci-components/pipeline@4.0.14
    inputs:
      team: forge
      app: svc-forge
      stacks:
        - name: core
          language: python
          paths: ["core/**"]
          project_dir: core
          test_paths: [tests]
          coverage_threshold: 85
          install_extras: "dev,test"
          image_name: forge-core
          dockerfile: Dockerfile
          build_context: core
        - name: ui
          language: typescript
          paths: ["ui/**"]
          project_dir: ui
          test_command: "npx vitest run --coverage --reporter=junit"
          coverage_threshold: 75
          image_name: forge-ui
          dockerfile: Dockerfile
          build_context: ui
